figure:
  id: Figure2A_workflow
  kind: workflow
  claim_anchor_id: C2A
  caption: Fig. 2A. Image-guided exposure planning and separate segmentation benchmarks.
    RGB photographs are segmented into tissue labels. Calibration-card-based pixel-to-length
    conversion supports image-to-array mapping, and predefined treatment priorities
    and exposure constraints determine the nine element durations. Photographs update
    the plan every two days; treatment follows the assigned schedule daily. Human
    DFUTissue and internal animal models are trained separately with dataset-specific
    labels. The schematic defines the workflow; the updated internal checkpoint is
    assessed by segmentation and wound-area analyses, while the photographic placement
    examples document array positioning.
