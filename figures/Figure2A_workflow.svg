<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="79mm" viewBox="0 0 183 79" role="img"><title>Image-guided exposure planning and separate segmentation benchmarks</title><desc>Fig. 2A. Image-guided exposure planning and separate segmentation benchmarks. RGB photographs are segmented into tissue labels. Calibration-card-based pixel-to-length conversion supports image-to-array mapping, and predefined treatment priorities and exposure constraints determine the nine element durations. Photographs update the plan every two days; treatment follows the assigned schedule daily. Human DFUTissue and internal animal models are trained separately with dataset-specific labels. The schematic defines the workflow; the updated internal checkpoint is assessed by segmentation and wound-area analyses, while the photographic placement examples document array positioning.</desc><rect width="183" height="79" fill="#FFFFFF" /><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.1" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L4.5,2.5 L0,5 Z" fill="#687789" /></marker></defs><rect id="photograph" x="7" y="8" width="27" height="29" rx="1.4" fill="#EEF4FA" stroke="#4C78A8" stroke-width="0.38" /><text id="text-1" x="20.5" y="17" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">RGB</text><text id="text-2" x="20.5" y="21.3" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">photograph</text><text id="text-3" x="20.5" y="31" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.822222222222222" font-weight="normal" fill="#5A6775">Every 2 days</text><rect id="segmentation" x="43" y="8" width="27" height="29" rx="1.4" fill="#EEF4FA" stroke="#4C78A8" stroke-width="0.38" /><text id="text-4" x="56.5" y="17" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">Tissue</text><text id="text-5" x="56.5" y="21.3" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">segmentation</text><text id="text-6" x="56.5" y="31" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.822222222222222" font-weight="normal" fill="#5A6775">Learned labels</text><rect id="mapping" x="79" y="8" width="27" height="29" rx="1.4" fill="#EEF4FA" stroke="#4C78A8" stroke-width="0.38" /><text id="text-7" x="92.5" y="17" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">Image–array</text><text id="text-8" x="92.5" y="21.3" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">mapping</text><text id="text-9" x="92.5" y="31" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.822222222222222" font-weight="normal" fill="#5A6775">Calibrated scale</text><rect id="rule" x="115" y="8" width="27" height="29" rx="1.4" fill="#FFF4E7" stroke="#D98935" stroke-width="0.38" /><text id="text-10" x="128.5" y="17" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">Predefined</text><text id="text-11" x="128.5" y="21.3" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">exposure rule</text><text id="text-12" x="128.5" y="31" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.822222222222222" font-weight="normal" fill="#5A6775">9 element times</text><rect id="treatment" x="151" y="8" width="27" height="29" rx="1.4" fill="#EEF4FA" stroke="#4C78A8" stroke-width="0.38" /><text id="text-13" x="164.5" y="17" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">Scheduled</text><text id="text-14" x="164.5" y="21.3" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">treatment</text><text id="text-15" x="164.5" y="31" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.822222222222222" font-weight="normal" fill="#5A6775">Daily</text><path d="M 34.6 22.5 L 42.1 22.5" stroke="#687789" stroke-width="0.45" fill="none" marker-end="url(#arrow)" /><path d="M 70.6 22.5 L 78.1 22.5" stroke="#687789" stroke-width="0.45" fill="none" marker-end="url(#arrow)" /><path d="M 106.6 22.5 L 114.1 22.5" stroke="#687789" stroke-width="0.45" fill="none" marker-end="url(#arrow)" /><path d="M 142.6 22.5 L 150.1 22.5" stroke="#687789" stroke-width="0.45" fill="none" marker-end="url(#arrow)" /><rect id="evaluation-strip" x="7" y="46" width="171" height="28" rx="1.4" fill="#F7F9FC" stroke="#D4DFEB" stroke-width="0.25" /><text id="text-16" x="12" y="51.5" text-anchor="start" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#415C77">Separately trained segmentation models</text><line x1="92" x2="92" y1="55.5" y2="70.5" stroke="#D4DFEB" stroke-width="0.25" /><text id="text-17" x="15" y="59.3" text-anchor="start" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">Human DFUTissue</text><text id="text-18" x="15" y="66" text-anchor="start" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.8927777777777774" font-weight="normal" fill="#243746">Fibrin · granulation · callus</text><text id="text-19" x="98" y="59.3" text-anchor="start" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.998611111111111" font-weight="bold" fill="#243746">Internal animal images</text><text id="text-20" x="98" y="66" text-anchor="start" dominant-baseline="central" font-family="DejaVu Sans" font-size="2.8927777777777774" font-weight="normal" fill="#243746">Epithelial · granulation · necrotic · pus</text></svg>